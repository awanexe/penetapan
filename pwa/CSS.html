<style>
    /* ═══════════════════════════════════════════════════════════════
       Dashboard SK — High-Contrast Modern Glass Aesthetic (Light Theme)
       ═══════════════════════════════════════════════════════════════ */

    :root {
        --glass-bg: rgba(255, 255, 255, 0.90);
        --glass-border: rgba(203, 213, 225, 0.80);
        --glass-glow: rgba(99, 102, 241, 0.08);
        --accent: #4f46e5;
        --accent-primary: #4f46e5;
        --accent-secondary: #0891b2;
        --accent-glow: rgba(99, 102, 241, 0.20);
    }

    /* ─── Base & Gradient Background ───────────────────────────── */
    body {
        font-family: 'Inter', sans-serif;
        background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 50%, #e2e8f0 100%);
        background-attachment: fixed;
        color: #0f172a;
        overflow-x: hidden;
    }

    h1,
    h2,
    h3,
    h4,
    .font-jakarta {
        font-family: 'Plus Jakarta Sans', sans-serif;
    }

    /* ─── Ambient Background ───────────────────────────────────── */
    .mesh-bg {
        position: fixed;
        inset: 0;
        z-index: -1;
        background:
            radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.08) 0px, transparent 50%),
            radial-gradient(at 100% 0%, rgba(79, 70, 229, 0.06) 0px, transparent 50%),
            radial-gradient(at 100% 100%, rgba(30, 58, 138, 0.05) 0px, transparent 50%),
            radial-gradient(at 0% 100%, rgba(6, 182, 212, 0.07) 0px, transparent 50%);
        filter: blur(80px);
        animation: meshShift 25s ease infinite alternate;
    }

    @keyframes meshShift {
        from {
            transform: scale(1);
        }

        to {
            transform: scale(1.08);
        }
    }

    /* ─── Glass Surfaces with Strong Card Contrast ─────────────── */
    .glass {
        background: var(--glass-bg);
        backdrop-filter: blur(16px) saturate(180%);
        -webkit-backdrop-filter: blur(16px) saturate(180%);
        border: 1px solid var(--glass-border);
        box-shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.06),
                    0 2px 6px -1px rgba(15, 23, 42, 0.04),
                    inset 0 1px 0 rgba(255, 255, 255, 1);
        transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .glass-header {
        background: rgba(255, 255, 255, 0.94);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-bottom: 1px solid rgba(203, 213, 225, 0.85);
        box-shadow: 0 2px 12px 0 rgba(15, 23, 42, 0.05);
    }

    .glass-header h1 {
        color: #0f172a !important;
    }

    .glass-header p {
        color: #475569 !important;
    }

    .glass-header a {
        background: rgba(99, 102, 241, 0.08) !important;
        border-color: rgba(99, 102, 241, 0.25) !important;
        color: #3730a3 !important;
    }

    .glass-header a:hover {
        background: rgba(99, 102, 241, 0.16) !important;
        color: #1e1b4b !important;
    }

    .glass-header a i {
        color: #4f46e5 !important;
    }

    .glass-header .bg-indigo-600\/20 {
        background: rgba(99, 102, 241, 0.12) !important;
        border-color: rgba(99, 102, 241, 0.30) !important;
    }

    .glass-hover:hover {
        transform: translateY(-4px) scale(1.008);
        background: rgba(255, 255, 255, 0.98);
        border-color: rgba(99, 102, 241, 0.45);
        box-shadow: 0 12px 30px -4px rgba(15, 23, 42, 0.10),
                    0 4px 12px -2px rgba(99, 102, 241, 0.12);
    }

    /* ─── Text Hierarchy & High Contrast Rules ─────────────────── */
    .text-white,
    .text-slate-200 {
        color: #0f172a !important;
    }

    .text-slate-400,
    .text-slate-500 {
        color: #475569 !important;
    }

    .text-slate-1000 {
        color: #1e293b !important;
    }

    /* ─── Rich, High-Contrast KPI Colors ───────────────────────── */
    .text-emerald-400,
    .text-emerald-500 {
        color: #047857 !important;
    }

    .text-amber-400,
    .text-amber-500 {
        color: #b45309 !important;
    }

    .text-sky-400,
    .text-sky-500 {
        color: #0369a1 !important;
    }

    .text-rose-400,
    .text-rose-500 {
        color: #be123c !important;
    }

    .text-violet-300,
    .text-violet-400,
    .text-violet-500 {
        color: #6d28d9 !important;
    }

    .text-teal-300,
    .text-teal-400,
    .text-teal-500 {
        color: #0f766e !important;
    }

    .text-indigo-400,
    .text-indigo-500 {
        color: #4338ca !important;
    }

    .text-blue-400,
    .text-blue-500 {
        color: #1d4ed8 !important;
    }

    /* KPI percentage text */
    .text-emerald-500\/60 {
        color: #047857 !important;
        opacity: 0.85;
    }

    .text-amber-500\/60 {
        color: #b45309 !important;
        opacity: 0.85;
    }

    .text-sky-500\/60 {
        color: #0369a1 !important;
        opacity: 0.85;
    }

    .text-rose-500\/60 {
        color: #be123c !important;
        opacity: 0.85;
    }

    /* Icon wrappers & ambient glows */
    .bg-white\/5 {
        background-color: rgba(241, 245, 249, 0.90) !important;
    }

    .border-white\/5,
    .border-white\/10 {
        border-color: rgba(203, 213, 225, 0.80) !important;
    }

    .bg-indigo-500\/10 {
        background-color: rgba(99, 102, 241, 0.08) !important;
    }

    .bg-emerald-500\/10 {
        background-color: rgba(16, 185, 129, 0.08) !important;
    }

    .bg-amber-500\/10 {
        background-color: rgba(245, 158, 11, 0.08) !important;
    }

    .bg-sky-500\/10 {
        background-color: rgba(14, 165, 233, 0.08) !important;
    }

    .bg-rose-500\/10 {
        background-color: rgba(244, 63, 94, 0.08) !important;
    }

    .bg-violet-500\/10 {
        background-color: rgba(124, 58, 237, 0.08) !important;
    }

    .bg-teal-500\/10 {
        background-color: rgba(20, 184, 166, 0.08) !important;
    }

    .bg-blue-500\/10 {
        background-color: rgba(59, 130, 246, 0.08) !important;
    }

    /* Badge pills on average cards */
    .bg-violet-500\/10.border-violet-500\/20 {
        background: rgba(124, 58, 237, 0.12) !important;
        border-color: rgba(124, 58, 237, 0.30) !important;
        color: #5b21b6 !important;
    }

    .bg-teal-500\/10.border-teal-500\/20 {
        background: rgba(20, 184, 166, 0.12) !important;
        border-color: rgba(20, 184, 166, 0.30) !important;
        color: #0f766e !important;
    }

    .text-violet-400\/60 {
        color: #5b21b6 !important;
    }

    .text-teal-400\/60 {
        color: #0f766e !important;
    }

    /* ─── Status Badges ────────────────────────────────────────── */
    .badge {
        display: inline-flex;
        align-items: center;
        padding: 0.25rem 0.85rem;
        border-radius: 9999px;
        font-size: 0.72rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        transition: all 0.2s;
    }

    .badge-done {
        background: rgba(5, 150, 105, 0.12) !important;
        color: #047857 !important;
        border: 1px solid rgba(5, 150, 105, 0.35) !important;
    }

    .badge-process {
        background: rgba(217, 119, 6, 0.12) !important;
        color: #b45309 !important;
        border: 1px solid rgba(217, 119, 6, 0.35) !important;
    }

    .badge-pending {
        background: rgba(2, 132, 199, 0.12) !important;
        color: #0369a1 !important;
        border: 1px solid rgba(2, 132, 199, 0.35) !important;
    }

    .badge-rejected {
        background: rgba(225, 29, 72, 0.12) !important;
        color: #be123c !important;
        border: 1px solid rgba(225, 29, 72, 0.35) !important;
    }

    .badge-default {
        background: rgba(71, 85, 105, 0.10) !important;
        color: #1e293b !important;
        border: 1px solid rgba(71, 85, 105, 0.28) !important;
    }

    /* ─── Scrollbar ────────────────────────────────────────────── */
    ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
    }

    ::-webkit-scrollbar-track {
        background: transparent;
    }

    ::-webkit-scrollbar-thumb {
        background: rgba(99, 102, 241, 0.30);
        border-radius: 10px;
    }

    ::-webkit-scrollbar-thumb:hover {
        background: #4f46e5;
    }

    /* ─── Reveal Animation ─────────────────────────────────────── */
    .reveal {
        opacity: 0;
        transform: translateY(20px);
        transition: all 0.6s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .reveal.active {
        opacity: 1;
        transform: translateY(0);
    }

    .stagger-1 {
        transition-delay: 0.08s;
    }

    .stagger-2 {
        transition-delay: 0.16s;
    }

    .stagger-3 {
        transition-delay: 0.24s;
    }

    .stagger-4 {
        transition-delay: 0.32s;
    }

    .stagger-5 {
        transition-delay: 0.40s;
    }

    .stagger-6 {
        transition-delay: 0.48s;
    }

    /* ─── Skeleton Loader ──────────────────────────────────────── */
    @keyframes shimmer {
        0% {
            background-position: -200% 0;
        }

        100% {
            background-position: 200% 0;
        }
    }

    .skeleton {
        background: linear-gradient(90deg,
                rgba(99, 102, 241, 0.05) 25%, rgba(99, 102, 241, 0.12) 50%, rgba(99, 102, 241, 0.05) 75%);
        background-size: 200% 100%;
        animation: shimmer 1.8s ease-in-out infinite;
        border-radius: 8px;
    }

    /* ─── Table ────────────────────────────────────────────────── */
    table thead th {
        background: rgba(241, 245, 249, 0.95) !important;
        color: #0f172a !important;
        font-size: 0.75rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        border-bottom: 2px solid rgba(203, 213, 225, 0.85) !important;
    }

    table tbody td {
        color: #0f172a !important;
        border-color: rgba(226, 232, 240, 0.85) !important;
        font-weight: 500;
    }

    tr:hover td {
        background: rgba(99, 102, 241, 0.06) !important;
    }

    .group-header {
        background: linear-gradient(90deg, rgba(99, 102, 241, 0.12), transparent) !important;
        font-weight: 800;
        color: #3730a3 !important;
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-size: 0.75rem;
    }

    /* ─── Form Inputs & Selects ────────────────────────────────── */
    input[type="text"],
    input[type="month"],
    select {
        background: #ffffff !important;
        border: 1.5px solid rgba(148, 163, 184, 0.60) !important;
        color: #0f172a !important;
        font-weight: 500 !important;
        transition: all 0.3s;
    }

    input::placeholder,
    select option {
        color: #64748b !important;
    }

    input:focus,
    select:focus {
        border-color: #4f46e5 !important;
        box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.22) !important;
        outline: none;
    }

    /* ─── Buttons ──────────────────────────────────────────────── */
    button.bg-white\/5,
    a.bg-white\/5 {
        background: rgba(99, 102, 241, 0.08) !important;
        border-color: rgba(99, 102, 241, 0.28) !important;
        color: #3730a3 !important;
    }

    button.bg-white\/5:hover,
    a.bg-white\/5:hover {
        background: rgba(99, 102, 241, 0.16) !important;
        color: #1e1b4b !important;
    }

    /* ─── Chart Containers ─────────────────────────────────────── */
    .chart-container-premium {
        position: relative;
        padding-top: 1.5rem;
    }

    .chart-container-premium::before {
        content: '';
        position: absolute;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 40px;
        height: 2px;
        background: var(--accent-primary);
        border-radius: 99px;
        opacity: 0.6;
    }

    /* ─── Icons ────────────────────────────────────────────────── */
    .text-slate-400 i,
    .text-slate-500 i {
        color: #475569 !important;
    }

    /* ─── Footer ───────────────────────────────────────────────── */
    footer {
        background: rgba(255, 255, 255, 0.75) !important;
        border-top: 1px solid rgba(203, 213, 225, 0.80) !important;
    }

    .bg-slate-900\/20 {
        background-color: rgba(255, 255, 255, 0.60) !important;
    }

    footer p {
        color: #475569 !important;
        font-weight: 700 !important;
    }

    /* ─── OPD Grid Boxes ────────────────────────────────────────── */
    .opd-box {
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 0.875rem 0.875rem 0.75rem;
        background: rgba(255, 255, 255, 0.88);
        border: 1px solid rgba(203, 213, 225, 0.75);
        border-radius: 14px;
        box-shadow: 0 2px 8px -2px rgba(15, 23, 42, 0.06);
        transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1),
                    box-shadow 0.25s cubic-bezier(0.4, 0, 0.2, 1),
                    border-color 0.25s;
        cursor: default;
        min-height: 120px;
    }

    .opd-box:hover {
        transform: translateY(-3px) scale(1.02);
        box-shadow: 0 8px 24px -4px rgba(99, 102, 241, 0.14),
                    0 2px 8px -2px rgba(15, 23, 42, 0.06);
        border-color: rgba(99, 102, 241, 0.35);
    }

    .opd-rank-1 {
        border-color: rgba(245, 158, 11, 0.55) !important;
        background: linear-gradient(135deg, rgba(254, 252, 232, 0.95), rgba(255, 255, 255, 0.95)) !important;
        box-shadow: 0 4px 14px -2px rgba(245, 158, 11, 0.18) !important;
    }

    .opd-rank-2 {
        border-color: rgba(148, 163, 184, 0.60) !important;
        background: linear-gradient(135deg, rgba(248, 250, 252, 0.98), rgba(255, 255, 255, 0.98)) !important;
    }

    .opd-rank-3 {
        border-color: rgba(180, 83, 9, 0.35) !important;
        background: linear-gradient(135deg, rgba(255, 247, 237, 0.95), rgba(255, 255, 255, 0.95)) !important;
    }

    .opd-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 0.375rem;
    }

    .opd-rank {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-size: 0.65rem;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #94a3b8;
    }

    .opd-rank-1 .opd-rank { color: #d97706 !important; }
    .opd-rank-2 .opd-rank { color: #64748b !important; }
    .opd-rank-3 .opd-rank { color: #b45309 !important; }

    .opd-total-badge {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-size: 0.65rem;
        font-weight: 800;
        color: #4338ca;
        background: rgba(99, 102, 241, 0.10);
        border: 1px solid rgba(99, 102, 241, 0.22);
        border-radius: 6px;
        padding: 0.1rem 0.45rem;
        letter-spacing: 0.03em;
    }

    .opd-rank-1 .opd-total-badge {
        color: #b45309;
        background: rgba(245, 158, 11, 0.12);
        border-color: rgba(245, 158, 11, 0.30);
    }

    .opd-name {
        font-size: 0.72rem;
        font-weight: 700;
        color: #1e293b;
        line-height: 1.35;
        flex: 1;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
        word-break: break-word;
        margin-bottom: 0.5rem;
    }

    .opd-counts {
        display: flex;
        flex-direction: column;
        gap: 0.2rem;
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-size: 0.67rem;
        font-weight: 700;
        flex-shrink: 0;
    }

    .opd-count-gov {
        display: inline-flex;
        align-items: center;
        gap: 0.25rem;
        color: #3730a3;
    }

    .opd-count-sek {
        display: inline-flex;
        align-items: center;
        gap: 0.25rem;
        color: #065f46;
    }

    .opd-dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        flex-shrink: 0;
    }

    .opd-dot-gov { background-color: #4f46e5; }
    .opd-dot-sek { background-color: #047857; }
</style>
