<script>
    // ═══════════════════════════════════════════════════════════════
    //  Dashboard SK — Frontend Logic
    // ═══════════════════════════════════════════════════════════════

    const ANIM_DURATION = 1000;
    const LOADING_TIMEOUT = 30000;

    let chartDecision = null;
    let chartStatus = null;
    let chartTrend = null;
    let chartYearlyDecision = null;
    let chartYearlyStatus = null;
    let chartYearlyTrend = null;

    // ─── State ────────────────────────────────────────────────────
    let analytics = null;
    let _timer = null;
    let isYearlyView = false;
    let availableYearsList = [];
    let currentSelectedYear = null;
    let yearlyDataCache = {};

    // ─── DOM Cache ────────────────────────────────────────────────
    const $ = id => document.getElementById(id);
    const loadingEl = $('loadingState');
    const dashEl = $('dashboardContent');
    const yearlyEl = $('yearlyContent');
    const lastUpdEl = $('lastUpdated');
    const rekapLink = $('rekapDataLink');
    const pickYearBtn = $('pickYearBtn');
    const pickYearBtnText = $('pickYearBtnText');
    const backToDashBtn = $('backToDashBtn');
    const yearPickerSelect = $('yearPickerSelect');

    // KPI elements (Dashboard)
    const kpi = {
        received: $('kpiReceived'), receivedPct: $('kpiReceivedPct'),
        done: $('kpiDone'), donePct: $('kpiDonePct'),
        process: $('kpiProcess'), processPct: $('kpiProcessPct'),
        pending: $('kpiPending'), pendingPct: $('kpiPendingPct'),
        rejected: $('kpiRejected'), rejectedPct: $('kpiRejectedPct'),
        avgSk: $('kpiAvgSk'), avgSkSub: $('kpiAvgSkSub'),
        avgWaktu: $('kpiAvgWaktu'), avgWaktuSub: $('kpiAvgWaktuSub')
    };

    // ═══════════════════════════════════════════════════════════════
    //  UTILITIES
    // ═══════════════════════════════════════════════════════════════

    function animateValue(el, start, end, dur) {
        let ts0 = null;
        const step = ts => {
            if (!ts0) ts0 = ts;
            const p = Math.min((ts - ts0) / dur, 1);
            el.textContent = Math.floor(p * (end - start) + start);
            if (p < 1) requestAnimationFrame(step);
        };
        requestAnimationFrame(step);
    }

    function fmtPct(val, total) {
        if (!total) return '(0,00%)';
        return '(' + (val / total * 100).toFixed(2).replace('.', ',') + '%)';
    }

    function tooltipCfg() {
        return {
            backgroundColor: '#ffffff',
            titleColor: '#0f172a',
            bodyColor: '#334155',
            borderColor: '#cbd5e1',
            borderWidth: 1.5,
            titleFont: { family: 'Plus Jakarta Sans', size: 13, weight: 'bold' },
            bodyFont: { family: 'Inter', size: 12, weight: '500' },
            padding: 12, cornerRadius: 10
        };
    }

    // ═══════════════════════════════════════════════════════════════
    //  CHART.JS PLUGIN — Data Labels on Slices/Bars/Points
    // ═══════════════════════════════════════════════════════════════

    const dataLabelsPlugin = {
        id: 'dataLabels',
        afterDatasetsDraw(chart) {
            const { ctx } = chart;
            ctx.save();
            ctx.font = 'bold 12px "Plus Jakarta Sans"';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            chart.data.datasets.forEach((ds, i) => {
                const meta = chart.getDatasetMeta(i);
                if (meta.hidden) return;
                meta.data.forEach((el, idx) => {
                    const v = ds.data[idx];
                    if (v == null) return;
                    const { x, y } = el.tooltipPosition();
                    if (chart.config.type === 'line') {
                        ctx.fillStyle = '#0f172a';
                        ctx.fillText(v, x, y - 16);
                    } else if (chart.config.options.indexAxis === 'y' && el.base !== undefined) {
                        const cx = (x + el.base) / 2;
                        if (v > 0) {
                            ctx.fillStyle = '#ffffff';
                            ctx.fillText(v, cx, y);
                        }
                    } else {
                        if (v > 0) {
                            ctx.fillStyle = '#ffffff';
                            ctx.fillText(v, x, y);
                        }
                    }
                });
            });
            ctx.restore();
        }
    };

    // ═══════════════════════════════════════════════════════════════
    //  INIT
    // ═══════════════════════════════════════════════════════════════

    document.addEventListener('DOMContentLoaded', () => {
        Chart.defaults.font.family = "'Inter', sans-serif";
        Chart.defaults.font.weight = '500';
        Chart.defaults.color = '#334155';
        Chart.defaults.borderColor = 'rgba(203, 213, 225, 0.6)';

        fetchData();
        setupReveal();
    });

    function setupReveal() {
        const obs = new IntersectionObserver(entries => {
            entries.forEach(e => {
                if (e.isIntersecting) { e.target.classList.add('active'); obs.unobserve(e.target); }
            });
        }, { threshold: 0.1, rootMargin: '0px 0px -50px 0px' });
        document.querySelectorAll('.reveal').forEach(el => obs.observe(el));
    }

    // ═══════════════════════════════════════════════════════════════
    //  DATA FETCHING
    // ═══════════════════════════════════════════════════════════════

    function showError(msg, icon) {
        if (_timer) { clearTimeout(_timer); _timer = null; }
        loadingEl.innerHTML = `<div class="glass p-8 rounded-2xl border-rose-500/20 text-center max-w-md">
        <i class="${icon || 'ph ph-warning-circle'} text-4xl text-rose-500 mb-4 block"></i>
        <p class="text-rose-400 font-bold">${msg}</p>
    </div>`;
    }

    function fetchData() {
        loadingEl.classList.remove('hidden');
        dashEl.classList.add('hidden');

        _timer = setTimeout(() => showError('Waktu pemuatan habis. Silakan refresh halaman.', 'ph ph-clock-countdown'), LOADING_TIMEOUT);

        google.script.run
            .withSuccessHandler(res => {
                if (_timer) { clearTimeout(_timer); _timer = null; }
                if (!res || typeof res !== 'object') {
                    showError('Server mengembalikan respons kosong. Silakan refresh halaman.');
                    return;
                }
                if (res.error) { showError(res.error); return; }
                try { processData(res); }
                catch (e) { console.error('processData:', e); showError('Gagal memproses data: ' + e.message); }
            })
            .withFailureHandler(err => {
                if (_timer) { clearTimeout(_timer); _timer = null; }
                console.error('Fetch error:', err);
                showError('Gagal memuat data: ' + (err.message || err));
            })
            .getDashboardData();
    }

    // ═══════════════════════════════════════════════════════════════
    //  DATA PROCESSING
    // ═══════════════════════════════════════════════════════════════

    function processData(res) {
        analytics = res.analytics || null;

        if (!analytics) {
            showError('Data analytics kosong dari server.');
            return;
        }

        const sc = analytics.statusCounts || { total: 0, done: 0, proc: 0, pend: 0, rej: 0 };

        updateKPIs(sc);
        renderDecisionChart(analytics.decisionTypes);
        renderStatusChart(analytics.statusMonitoring);
        renderTrendChart(analytics.monthlyTrend);
        renderDeptGrid(analytics.departmentRanking);

        lastUpdEl.textContent = res.lastUpdate || '-';

        // Simpan available years dari backend jika tersedia
        if (res.availableYears && res.availableYears.length > 0) {
            availableYearsList = res.availableYears;
            populateYearPicker(availableYearsList, availableYearsList[0]);
        }

        // Set Rekap Data link to active spreadsheet URL
        if (res.spreadsheetUrl && rekapLink) {
            rekapLink.href = res.spreadsheetUrl;
        }

        loadingEl.classList.add('hidden');
        dashEl.classList.remove('hidden');
        setTimeout(setupReveal, 100);
    }

    // ═══════════════════════════════════════════════════════════════
    //  KPI CARDS
    // ═══════════════════════════════════════════════════════════════

    function updateKPIs(sc) {
        animateValue(kpi.received, 0, sc.total, ANIM_DURATION);
        animateValue(kpi.done, 0, sc.done, ANIM_DURATION);
        animateValue(kpi.process, 0, sc.proc, ANIM_DURATION);
        animateValue(kpi.pending, 0, sc.pend, ANIM_DURATION);
        animateValue(kpi.rejected, 0, sc.rej, ANIM_DURATION);

        kpi.receivedPct.textContent = '(100,00%)';
        kpi.donePct.textContent = fmtPct(sc.done, sc.total);
        kpi.processPct.textContent = fmtPct(sc.proc, sc.total);
        kpi.pendingPct.textContent = fmtPct(sc.pend, sc.total);
        kpi.rejectedPct.textContent = fmtPct(sc.rej, sc.total);

        // Monthly incoming average
        const mi = analytics.monthlyIncoming || {};
        const avg = mi.average || 0;
        animateValue(kpi.avgSk, 0, avg, ANIM_DURATION);
        const trendYears = analytics.trendYears || 0;
        kpi.avgSkSub.textContent = trendYears > 0
            ? `Berdasarkan ${sc.total} berkas dari ${trendYears} tahun`
            : 'Belum ada data tren Tahunan';

        // Processing time
        const pt = analytics.processingTime || {};
        animateValue(kpi.avgWaktu, 0, pt.average || 0, ANIM_DURATION);
        const completedCount = (analytics.statusCounts && analytics.statusCounts.done) || 0;
        kpi.avgWaktuSub.textContent = completedCount > 0
            ? `Berdasarkan ${completedCount} SK yang selesai`
            : 'Belum ada SK selesai';
    }

    // ═══════════════════════════════════════════════════════════════
    //  CHART RENDERERS
    // ═══════════════════════════════════════════════════════════════

    const COLORS = ['#6366f1', '#10b981', '#f59e0b', '#0ea5e9', '#f43f5e', '#8b5cf6', '#14b8a6', '#ef4444', '#06b6d4', '#84cc16'];

    /** Single-edge border radius helper for horizontal bars. */
    function edgeRadius(left, right, r) {
        return {
            topLeft: left ? r : 0, bottomLeft: left ? r : 0,
            topRight: right ? r : 0, bottomRight: right ? r : 0
        };
    }

    // ── Decision Type Chart ───────────────────────────────────────

    function renderDecisionChart(dt, canvasId = 'decisionChart') {
        const isYearly = canvasId === 'yearlyDecisionChart';
        let rawLabels = (dt && dt.labels) || [];
        let rawValues = (dt && dt.values) || [];

        // Direct fallback dari gubernur/sekda jika labels kosong
        if (rawLabels.length === 0 && dt && (dt.gubernur != null || dt.sekda != null)) {
            rawLabels = ['SK Gubernur', 'SK Sekda'];
            rawValues = [dt.gubernur || 0, dt.sekda || 0];
        }

        // Sort from largest to smallest
        const paired = rawLabels.map((label, i) => ({ label, value: rawValues[i] || 0 }));
        paired.sort((a, b) => b.value - a.value);
        const labels = paired.map(p => p.label);
        const values = paired.map(p => p.value);

        // Konsistensi warna tema: SK Gubernur -> Indigo (#4f46e5), SK Sekda -> Emerald (#047857)
        const colorMap = {
            'SK Gubernur': '#4f46e5',
            'Gubernur': '#4f46e5',
            'SK Sekda': '#047857',
            'Sekda': '#047857'
        };
        const colors = labels.map((l, i) => colorMap[l] || COLORS[i % COLORS.length]);
        const total = (dt && dt.total != null && dt.total > 0) ? dt.total : values.reduce((s, v) => s + v, 0);

        if (isYearly) {
            if (chartYearlyDecision) chartYearlyDecision.destroy();
        } else {
            if (chartDecision) chartDecision.destroy();
        }

        const canvasEl = $(canvasId);
        if (!canvasEl) return;

        // Always render as horizontal stacked progress bar
        let lastNonZero = 0;
        for (let i = values.length - 1; i >= 0; i--) { if (values[i] > 0) { lastNonZero = i; break; } }
        const datasets = labels.map((label, i) => ({
            label: label,
            data: [values[i]],
            backgroundColor: colors[i],
            borderRadius: edgeRadius(i === 0, i === lastNonZero, 12),
            borderSkipped: false,
            barThickness: 44
        }));

        const newChart = new Chart(canvasEl.getContext('2d'), {
            type: 'bar',
            data: {
                labels: ['Jenis Keputusan'],
                datasets
            },
            options: {
                indexAxis: 'y', responsive: true, maintainAspectRatio: false,
                plugins: {
                    legend: { position: 'bottom', labels: { usePointStyle: true, padding: 20, font: { weight: 'bold' }, color: '#334155' } },
                    tooltip: {
                        ...tooltipCfg(),
                        callbacks: {
                            label: function (ctx) {
                                const v = ctx.parsed.x;
                                const pct = total > 0 ? (v / total * 100).toFixed(1) : '0.0';
                                return ' ' + ctx.dataset.label + ': ' + v + ' (' + pct + '%)';
                            }
                        }
                    }
                },
                scales: {
                    x: { stacked: true, display: false, grid: { display: false } },
                    y: { stacked: true, display: false, grid: { display: false } }
                }
            },
            plugins: [dataLabelsPlugin]
        });

        if (isYearly) chartYearlyDecision = newChart;
        else chartDecision = newChart;
    }

    // ── Status Monitoring — Stacked Progress Bar ──────────────────

    function renderStatusChart(sm, canvasId = 'statusChart') {
        const isYearly = canvasId === 'yearlyStatusChart';
        if (!sm) sm = { completed: 0, onProgress: 0, pending: 0, rejected: 0 };

        const total = (sm.completed || 0) + (sm.onProgress || 0) + (sm.pending || 0) + (sm.rejected || 0);

        // All 4 statuses, sorted from largest to smallest
        const items = [
            { label: 'Completed', val: sm.completed || 0, color: '#047857' },
            { label: 'On Progress', val: sm.onProgress || 0, color: '#b45309' },
            { label: 'Pending', val: sm.pending || 0, color: '#0369a1' },
            { label: 'Rejected', val: sm.rejected || 0, color: '#be123c' }
        ];
        items.sort((a, b) => b.val - a.val);

        if (isYearly) {
            if (chartYearlyStatus) chartYearlyStatus.destroy();
        } else {
            if (chartStatus) chartStatus.destroy();
        }

        const canvasEl = $(canvasId);
        if (!canvasEl) return;

        // Build datasets — find last non-zero segment for proper right-edge rounding
        let lastNonZero = 0;
        for (let i = items.length - 1; i >= 0; i--) { if (items[i].val > 0) { lastNonZero = i; break; } }
        const datasets = items.map((x, i) => ({
            label: x.label,
            data: [x.val],
            backgroundColor: x.color,
            borderRadius: edgeRadius(i === 0, i === lastNonZero, 12),
            borderSkipped: false,
            barThickness: 48
        }));

        const newChart = new Chart(canvasEl.getContext('2d'), {
            type: 'bar',
            data: { labels: ['Status Pengerjaan'], datasets },
            options: {
                indexAxis: 'y',
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        position: 'bottom',
                        labels: { usePointStyle: true, padding: 20, font: { weight: 'bold' }, color: '#334155' }
                    },
                    tooltip: {
                        ...tooltipCfg(),
                        callbacks: {
                            label: function (ctx) {
                                const v = ctx.parsed.x;
                                const pct = total > 0 ? (v / total * 100).toFixed(1) : '0.0';
                                return ' ' + ctx.dataset.label + ': ' + v + ' (' + pct + '%)';
                            }
                        }
                    }
                },
                scales: {
                    x: { stacked: true, display: false, grid: { display: false } },
                    y: { stacked: true, display: false, grid: { display: false } }
                }
            },
            plugins: [dataLabelsPlugin]
        });

        if (isYearly) chartYearlyStatus = newChart;
        else chartStatus = newChart;
    }

    // ── Trend Line Chart ──────────────────────────────────────────

    function renderTrendChart(mt, canvasId = 'trendChart', datasetLabel = 'SK Masuk per Tahun') {
        const isYearly = canvasId === 'yearlyTrendChart';
        const labels = (mt && mt.labels) || [];
        const values = (mt && mt.values) || [];

        if (isYearly) {
            if (chartYearlyTrend) chartYearlyTrend.destroy();
        } else {
            if (chartTrend) chartTrend.destroy();
        }

        const canvasEl = $(canvasId);
        if (!canvasEl) return;

        const newChart = new Chart(canvasEl.getContext('2d'), {
            type: 'line',
            data: {
                labels,
                datasets: [{
                    label: datasetLabel, data: values,
                    borderColor: '#4f46e5', backgroundColor: 'rgba(79, 70, 229, 0.12)',
                    borderWidth: 3, tension: 0.4, fill: true,
                    pointBackgroundColor: '#4338ca', pointRadius: 5, pointHoverRadius: 7
                }]
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                plugins: { legend: { display: false }, tooltip: tooltipCfg() },
                scales: {
                    y: { display: false, beginAtZero: true, grid: { display: false } },
                    x: { grid: { display: false }, ticks: { font: { weight: 'bold', size: 11 }, color: '#334155' } }
                },
                layout: { padding: { top: 24 } }
            },
            plugins: [dataLabelsPlugin]
        });

        if (isYearly) chartYearlyTrend = newChart;
        else chartTrend = newChart;
    }

    // ── Department OPD Grid ───────────────────────────────────────

    function renderDeptGrid(dr, containerId = 'deptGrid') {
        const container = $(containerId);
        if (!container) return;

        const rawLabels = (dr && dr.labels) || [];
        const rawGov    = (dr && dr.gubernur) || [];
        const rawSek    = (dr && dr.sekda) || [];

        // Build paired array sorted by total desc
        const paired = rawLabels.map((label, i) => ({
            label: label,
            gov: rawGov[i] || 0,
            sek: rawSek[i] || 0,
            total: (rawGov[i] || 0) + (rawSek[i] || 0)
        }));
        paired.sort((a, b) => b.total - a.total);

        if (paired.length === 0) {
            container.innerHTML = '<p class="col-span-5 text-center text-slate-500 font-semibold py-12">Belum ada data perangkat daerah.</p>';
            return;
        }

        container.innerHTML = paired.map((opd, idx) => {
            const rank = idx + 1;
            const rankClass = rank === 1
                ? 'opd-box opd-rank-1'
                : rank === 2
                ? 'opd-box opd-rank-2'
                : rank === 3
                ? 'opd-box opd-rank-3'
                : 'opd-box';

            return `<div class="${rankClass}">
                <div class="opd-header">
                    <div class="opd-rank">#${rank}</div>
                    <div class="opd-total-badge">${opd.total} SK</div>
                </div>
                <div class="opd-name">${opd.label}</div>
                <div class="opd-counts">
                    <span class="opd-count-gov" title="SK Gubernur">
                        <span class="opd-dot opd-dot-gov"></span>SK Gubernur ${opd.gov}
                    </span>
                    <span class="opd-count-sek" title="SK Sekda">
                        <span class="opd-dot opd-dot-sek"></span>SK Sekda ${opd.sek}
                    </span>
                </div>
            </div>`;
        }).join('');
    }

    // ═══════════════════════════════════════════════════════════════
    //  DATA TAHUNAN (PICK YEAR)
    // ═══════════════════════════════════════════════════════════════

    function populateYearPicker(years, selectedYear) {
        if (!yearPickerSelect) return;
        if (!years || years.length === 0) return;
        yearPickerSelect.innerHTML = years.map(y => 
            `<option value="${y}" ${String(y) === String(selectedYear) ? 'selected' : ''}>Tahun ${y}</option>`
        ).join('');
    }

    function showYearlyView(year) {
        isYearlyView = true;
        dashEl.classList.add('hidden');
        yearlyEl.classList.remove('hidden');

        if (pickYearBtnText) pickYearBtnText.textContent = 'Dashboard';

        const selYear = year || currentSelectedYear || (availableYearsList.length > 0 ? availableYearsList[0] : new Date().getFullYear());
        populateYearPicker(availableYearsList, selYear);
        loadYearlyData(selYear);
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function showDashboardView() {
        isYearlyView = false;
        yearlyEl.classList.add('hidden');
        dashEl.classList.remove('hidden');

        if (pickYearBtnText) pickYearBtnText.textContent = 'Pick Year';

        window.scrollTo({ top: 0, behavior: 'smooth' });
        setTimeout(setupReveal, 50);
    }

    function loadYearlyData(year) {
        currentSelectedYear = year;
        if (yearPickerSelect && yearPickerSelect.value != year) {
            yearPickerSelect.value = year;
        }

        // Cek cache data tahunan
        if (yearlyDataCache[year]) {
            processYearlyData(yearlyDataCache[year]);
            return;
        }

        const yLoading = $('yearlyLoadingState');
        const yDataSec = $('yearlyDataSection');
        if (yLoading) yLoading.classList.remove('hidden');
        if (yDataSec) yDataSec.classList.add('hidden');

        google.script.run
            .withSuccessHandler(res => {
                if (yLoading) yLoading.classList.add('hidden');
                if (yDataSec) yDataSec.classList.remove('hidden');

                if (!res || res.error) {
                    alert('Gagal memuat data tahun ' + year + ': ' + ((res && res.error) || 'Respon kosong'));
                    return;
                }

                yearlyDataCache[year] = res;
                if (res.availableYears && res.availableYears.length > 0) {
                    availableYearsList = res.availableYears;
                    populateYearPicker(availableYearsList, res.targetYear);
                }
                processYearlyData(res);
            })
            .withFailureHandler(err => {
                if (yLoading) yLoading.classList.add('hidden');
                if (yDataSec) yDataSec.classList.remove('hidden');
                console.error('getYearlyData error:', err);
                alert('Gagal memuat data tahunan: ' + (err.message || err));
            })
            .getYearlyData(year);
    }

    function processYearlyData(res) {
        const ya = res.analytics || null;
        if (!ya) return;

        // Update Subtitle & last updated
        const ySub = $('yearlySubtitleYear');
        if (ySub) ySub.textContent = res.targetYear;
        const yUpd = $('yearlyLastUpdated');
        if (yUpd) yUpd.textContent = res.lastUpdate || '-';

        // 5 KPI Cards (Tahun Terpilih)
        const sc = ya.statusCounts || { total: 0, done: 0, proc: 0, pend: 0, rej: 0 };
        animateValue($('yearlyKpiReceived'), 0, sc.total, ANIM_DURATION);
        $('yearlyKpiReceivedPct').textContent = '100%';

        animateValue($('yearlyKpiDone'), 0, sc.done, ANIM_DURATION);
        $('yearlyKpiDonePct').textContent = fmtPct(sc.done, sc.total);

        animateValue($('yearlyKpiProcess'), 0, sc.proc, ANIM_DURATION);
        $('yearlyKpiProcessPct').textContent = fmtPct(sc.proc, sc.total);

        animateValue($('yearlyKpiPending'), 0, sc.pend, ANIM_DURATION);
        $('yearlyKpiPendingPct').textContent = fmtPct(sc.pend, sc.total);

        animateValue($('yearlyKpiRejected'), 0, sc.rej, ANIM_DURATION);
        $('yearlyKpiRejectedPct').textContent = fmtPct(sc.rej, sc.total);

        // 2 Average Cards (Periode 12 Bulan)
        const mi = ya.monthlyIncoming || {};
        animateValue($('yearlyKpiAvgSk'), 0, mi.average || 0, ANIM_DURATION);
        $('yearlyKpiAvgSkSub').textContent = `Berdasarkan ${sc.total} berkas tahun ${res.targetYear}`;

        // Rata-Rata Lama Pengerjaan SK = Total Completed SK ÷ 250 hari kerja per tahun
        // Menggunakan sc.done (Completed SK tahun terpilih) yang sudah difilter via yearPickerSelect.
        // Tidak menggunakan pt.average (rata-rata kalender per SK); formula ini hanya berlaku
        // pada card Rata-Rata Lama Pengerjaan SK — card/komponen Rata-Rata Harian lainnya tidak berubah.
        const avgWaktuHariKerja = sc.done > 0 ? Math.round(sc.done / 250) : 0;
        animateValue($('yearlyKpiAvgWaktu'), 0, avgWaktuHariKerja, ANIM_DURATION);
        $('yearlyKpiAvgWaktuSub').textContent = sc.done > 0
            ? `Berdasarkan ${sc.done} SK yang Selesai tahun ${res.targetYear}`
            : 'Belum ada SK selesai';

        // Charts
        renderDecisionChart(ya.decisionTypes, 'yearlyDecisionChart');
        renderStatusChart(ya.statusMonitoring, 'yearlyStatusChart');
        renderTrendChart(ya.monthlyTrend, 'yearlyTrendChart', `SK Masuk per Bulan (${res.targetYear})`);
        renderDeptGrid(ya.departmentRanking, 'yearlyDeptGrid');

        setTimeout(setupReveal, 50);
    }

    // ── Inisialisasi Event Listener Pick Year ──────────────────────
    if (pickYearBtn) {
        pickYearBtn.addEventListener('click', () => {
            if (isYearlyView) showDashboardView();
            else showYearlyView();
        });
    }
    if (backToDashBtn) {
        backToDashBtn.addEventListener('click', () => showDashboardView());
    }
    if (yearPickerSelect) {
        yearPickerSelect.addEventListener('change', (e) => {
            loadYearlyData(parseInt(e.target.value, 10));
        });
    }
</script>
